<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Motion Clipper</title>

  <!-- Tailwind CSS CDN for sleek styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
    
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold tracking-tight text-indigo-400">Apex Motion Clipper</h1>
      <p class="text-sm text-slate-400 mt-1">Convert long videos into viral 9:16 Shorts instantly.</p>
    </div>

    <!-- URL Input Form -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Video URL
        </label>
        <input 
          id="videoUrl" 
          type="url" 
          placeholder="Paste YouTube, Call of Duty clip, or video link..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
            Start Time (Seconds)
          </label>
          <input 
            id="startTime" 
            type="number" 
            value="0" 
            min="0"
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
            Duration (Seconds)
          </label>
          <input 
            id="duration" 
            type="number" 
            value="30" 
            max="60" 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
      </div>

      <button 
        onclick="generateClip()" 
        id="btnGenerate" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg shadow-lg transition-all text-sm mt-2"
      >
        Generate Vertical Short
      </button>
    </div>

    <!-- Processing Indicator -->
    <div id="loader" class="hidden text-center py-6">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
      <p class="text-sm text-slate-400 mt-2">Cropping video into 9:16 Short format...</p>
    </div>

    <!-- Output Preview Section -->
    <div id="outputSection" class="hidden mt-6 pt-6 border-t border-slate-700 text-center">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3">Your Generated Short</h2>
      
      <div class="flex justify-center">
        <video id="clipPreview" controls class="h-96 rounded-lg border border-slate-700 shadow-md bg-black"></video>
      </div>

      <!-- Action Buttons -->
      <div class="mt-4 flex flex-col gap-2">
        <a 
          id="downloadBtn" 
          download="apex_short.mp4" 
          class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition-all"
        >
          Download Short
        </a>

        <button 
          onclick="shareClip()" 
          class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2.5 rounded-lg text-sm transition-all"
        >
          Share to TikTok / Shorts / Instagram
        </button>
      </div>
    </div>

  </div>

  <script>
    // Replace with your Render API Web Service URL
    const API_BASE_URL = "https://apex-motion-clipper-api.onrender.com";

    async function generateClip() {
      const url = document.getElementById("videoUrl").value;
      const startTime = parseInt(document.getElementById("startTime").value);
      const duration = parseInt(document.getElementById("duration").value);

      if (!url) {
        alert("Please enter a video URL first.");
        return;
      }

      const loader = document.getElementById("loader");
      const outputSection = document.getElementById("outputSection");
      const btn = document.getElementById("btnGenerate");

      loader.classList.remove("hidden");
      outputSection.classList.add("hidden");
      btn.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/create-clip`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url, start_time: startTime, duration: duration })
        });

        if (!response.ok) {
          throw new Error("Failed to process video clip.");
        }

        const blob = await response.blob();
        const videoBlobUrl = URL.createObjectURL(blob);

        const preview = document.getElementById("clipPreview");
        const downloadBtn = document.getElementById("downloadBtn");

        preview.src = videoBlobUrl;
        downloadBtn.href = videoBlobUrl;

        outputSection.classList.remove("hidden");
      } catch (err) {
        alert("Error generating clip: " + err.message);
      } finally {
        loader.classList.add("hidden");
        btn.disabled = false;
      }
    }

    async function shareClip() {
      const videoElement = document.getElementById("clipPreview");
      if (!videoElement.src) return;

      if (navigator.share) {
        try {
          const response = await fetch(videoElement.src);
          const blob = await response.blob();
          const file = new File([blob], "short_clip.mp4", { type: "video/mp4" });

          await navigator.share({
            title: "Apex Motion Short",
            text: "Check out my new clip!",
            files: [file]
          });
        } catch (err) {
          console.log("Share skipped or canceled:", err);
        }
      } else {
        alert("Web Share API is not supported in this browser. Use the Download button to upload directly to YouTube, TikTok, or Instagram.");
      }
    }
  </script>
</body>
</html>
